<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — MABUMBA TECH</title>
    <link rel="icon" href="../../img/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../css/style.css?v2">
    <link rel="stylesheet" href="../../css/forms.css?v2">
    <link rel="stylesheet" href="../../css/auth.css?v2">
    <link rel="stylesheet" href="../../css/login.css?v3">
</head>

<body class="login-page">
    <main class="lg-stage">

        <!-- Animated anime-style scene (decorative, drawn by js/login-scene.js) -->
        <canvas id="lgScene" class="lg-scene" aria-hidden="true"></canvas>
        <div class="lg-vignette" aria-hidden="true"></div>
        <div class="lg-leak" aria-hidden="true"></div>

        <div class="lg-caption" aria-hidden="true">
            <span class="lg-cap-kicker">MABUMBA TECH</span>
            <p class="lg-cap-words"><span>Technology.</span><span>Innovation.</span><span>Solution.</span></p>
        </div>

        <div class="lg-wrap">
            <div class="lg-card">

                <img class="lg-logo" src="../../img/logo.png" alt="MABUMBA TECH">

                <div class="lg-head">
                    <span class="lg-secure"><i class="bi bi-key-fill"></i> Account recovery</span>
                    <h1>Reset your <em>password</em></h1>
                    <p>Customer accounts only. Enter your username or email to find your security question.</p>
                </div>

                <div id="flashContainer"></div>

                <!-- Step 1: identify the account -->
                <form id="identityForm" class="form">
                    <div class="form-group">
                        <label>Username or Email</label>
                        <div class="lg-field">
                            <i class="bi bi-person lg-ic"></i>
                            <input type="text" name="identity" placeholder="Enter your username or email" required autofocus>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block"><i class="bi bi-search"></i> <span>Continue</span></button>
                </form>

                <!-- Step 2: answer the question and set a new password (hidden until step 1 succeeds) -->
                <form id="resetForm" class="form" style="display:none;">
                    <div class="form-group">
                        <label>Security Question</label>
                        <p id="questionText" style="font-weight:600;margin:0 0 10px;"></p>
                    </div>
                    <div class="form-group">
                        <label>Your Answer</label>
                        <div class="lg-field">
                            <i class="bi bi-patch-question lg-ic"></i>
                            <input type="text" name="security_answer" placeholder="Type your answer" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>New Password</label>
                        <div class="lg-field">
                            <i class="bi bi-lock lg-ic"></i>
                            <input type="password" name="new_password" placeholder="At least 6 characters" required minlength="6">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Confirm New Password</label>
                        <div class="lg-field">
                            <i class="bi bi-lock-fill lg-ic"></i>
                            <input type="password" name="confirm_password" placeholder="Repeat the new password" required minlength="6">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block"><i class="bi bi-check2-circle"></i> <span>Reset Password</span></button>
                </form>

                <a href="../home.html" class="lg-home"><i class="bi bi-arrow-left"></i> Back to website</a>
                <p class="auth-foot">Remembered it? <a href="login.html">Back to login</a></p>
            </div>
        </div>

    </main>
    <script src="../../js/config.js?v2"></script>
    <script src="../../js/pages/auth-forgot-password.js?v2"></script>
    <script src="../../js/login-scene.js?v1" defer></script>
</body>

</html>
